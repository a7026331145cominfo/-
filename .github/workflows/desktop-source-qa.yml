name: Verify Desktop Source Buttons

on:
  push:
    branches:
      - 'ai-desktop-source-*'
    paths:
      - 'desktop-source/**'
      - '.github/workflows/desktop-source-qa.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'desktop-source/**'
      - '.github/workflows/desktop-source-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-wiring-and-build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Validate button-wiring test syntax
        shell: pwsh
        run: |
          $testPath = (Resolve-Path ./desktop-source/tools/Test-DesktopButtonWiring.ps1).Path
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($testPath, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object {
              Write-Error ("Line {0}: {1}" -f $_.Extent.StartLineNumber, $_.Message)
            }
            exit 1
          }
          Write-Host "PASS: button-wiring test PowerShell syntax"

      - name: Check button wiring and permissions
        shell: pwsh
        run: ./desktop-source/tools/Test-DesktopButtonWiring.ps1

      - name: Validate safe local updater PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path ./desktop-source/Apply-Desktop-Update.ps1).Path,
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host "PASS: updater PowerShell syntax"

      - name: Build WinForms desktop application
        shell: pwsh
        run: dotnet build desktop-source/src/AlSaqarAccounting/AlSaqarAccounting.csproj --configuration Release
