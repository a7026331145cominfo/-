name: Extract native screen-link evidence

on:
  push:
    branches: [source-review]
    paths:
      - .github/workflows/source-link-audit.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract historical reports and identify native routing
        shell: bash
        run: |
          set -euo pipefail
          COMMIT="3a9492c85ca92a03d9a2b696ec8d351f380526bd"
          TMP="$RUNNER_TEMP/native-link-audit"
          mkdir -p "$TMP/unpacked"
          git cat-file -e "$COMMIT^{commit}"
          git show "$COMMIT:iLoveZIP_Create(1).zip" > "$TMP/outer.zip"
          unzip -q -o "$TMP/outer.zip" -d "$TMP/unpacked"
          for level in 1 2 3 4 5; do
            found=0
            while IFS= read -r -d '' z; do
              found=1
              d="$(dirname "$z")/__unzipped__"
              mkdir -p "$d"
              unzip -q -o "$z" -d "$d"
              rm -f "$z"
            done < <(find "$TMP/unpacked" -type f -iname '*.zip' -print0)
            [ "$found" -eq 0 ] && break
          done
          python3 - "$TMP/unpacked" NATIVE_LINK_EVIDENCE.md <<'PY'
          import pathlib, re, sys
          root = pathlib.Path(sys.argv[1])
          out = pathlib.Path(sys.argv[2])
          all_files = sorted(p for p in root.rglob('*') if p.is_file())
          wanted = [
              'MajedSoft-TRUE-Screen-Mapping.txt',
              '00_REAL_INTERNAL_UI_DESIGN.txt',
              'GTSErp_SOURCE_MAP.txt',
              '05_CORE_SOURCE_REPORT.txt',
              'AlSaqar_Internal_Source_Map.txt',
              '06_SALES_PURCHASE_CORE.txt',
              '04_ORIGINAL_ERP_MODULE_FILES.txt',
              '01_ORIGINAL_PROJECT_TREE.txt',
          ]
          by_name = {p.name: p for p in all_files}
          def decode(path):
              raw = path.read_bytes()
              if b'\x00' in raw[:4096]:
                  try: return raw.decode('utf-16')
                  except UnicodeError: pass
              for enc in ('utf-8-sig', 'cp1256', 'latin-1'):
                  try: return raw.decode(enc)
                  except UnicodeError: pass
              return raw.decode('utf-8', errors='replace')
          files = [(name, by_name[name]) for name in wanted if name in by_name]
          lines = [
              '# Native screen-link evidence extracted from historical source reports',
              '',
              'Generated from archive commit 3a9492c85ca92a03d9a2b696ec8d351f380526bd.',
              'The archive is a set of source-analysis reports rather than loose compilable project files; use the excerpts to ground route mappings.',
              '',
              f'- Extracted files: {len(all_files)}',
              f'- Loose C# files: {sum(p.suffix.lower() == ".cs" for p in all_files)}',
              f'- Loose project files: {sum(p.suffix.lower() in (".csproj", ".sln") for p in all_files)}',
              '',
              '## Key report inventory',
              '',
          ]
          for name, p in files:
              lines.append(f'- {name}: {p.stat().st_size:,} bytes')
          def block(title, path, excerpt):
              lines.extend(['', f'### {title} — {path.name}', '', excerpt, ''])
          if 'MajedSoft-TRUE-Screen-Mapping.txt' in by_name:
              p = by_name['MajedSoft-TRUE-Screen-Mapping.txt']
              src = decode(p).splitlines()
              block('Opening of the exact screen map', p, '\n'.join(f'{i+1}: {src[i][:500]}' for i in range(min(100, len(src)))))
          # Targeted form-name occurrences in the mapping/source reports.
          targets = [
              ('sales invoice', re.compile(r'FrmCashir(?!Restaurant|Pharm|Washing|WithOutGroup)', re.I)),
              ('purchase invoice', re.compile(r'FrmPurchases(?!Return)', re.I)),
              ('sales return', re.compile(r'FrmOrderReturn', re.I)),
              ('purchase return', re.compile(r'FrmPurchasesReturn', re.I)),
              ('receipt voucher', re.compile(r'FrmReceipts(Big)?', re.I)),
              ('payment voucher', re.compile(r'FrmPayment(Big)?', re.I)),
              ('journal entry', re.compile(r'FrmDailyRestrictions', re.I)),
              ('item movement report', re.compile(r'FrmRPMovementItem', re.I)),
          ]
          source_priority = [
              'MajedSoft-TRUE-Screen-Mapping.txt',
              '00_REAL_INTERNAL_UI_DESIGN.txt',
              'GTSErp_SOURCE_MAP.txt',
              '05_CORE_SOURCE_REPORT.txt',
              'AlSaqar_Internal_Source_Map.txt',
              '06_SALES_PURCHASE_CORE.txt',
          ]
          for title, regex in targets:
              lines.extend(['', f'## {title.title()} — exact references', ''])
              total = 0
              for name in source_priority:
                  p = by_name.get(name)
                  if not p: continue
                  src = decode(p).splitlines()
                  hits = [i for i, line in enumerate(src) if regex.search(line)]
                  # Skip repeated file-inventory matches if a code/source report has real method lines.
                  for i in hits[:6]:
                      a, b = max(0, i-2), min(len(src), i+3)
                      excerpt = '\n'.join(f'{j+1}: {src[j][:400]}' for j in range(a,b))
                      block(f'Match at line {i+1}', p, excerpt)
                      total += 1
                      if total >= 12: break
                  if total >= 12: break
              if total == 0:
                  lines.append('No exact reference found in the selected source reports.')
          lines.extend(['', '## Routing and permission implementation references', ''])
          routing = re.compile(r'CheckUserPage\(|CheckUserPageEvent(Save|Edit|Delete)|ScreenTypeName|ScreenNum|User_Screens|User_Permission|Form\.ShowDialog|Activator\.CreateInstance|Type\.GetType', re.I)
          total = 0
          for name in ['05_CORE_SOURCE_REPORT.txt', 'AlSaqar_Internal_Source_Map.txt', 'GTSErp_SOURCE_MAP.txt', '00_REAL_INTERNAL_UI_DESIGN.txt']:
              p = by_name.get(name)
              if not p: continue
              src = decode(p).splitlines()
              for i, line in enumerate(src):
                  if not routing.search(line): continue
                  # Prefer code excerpts over plain archive paths.
                  if len(line.strip()) < 8: continue
                  a, b = max(0, i-2), min(len(src), i+3)
                  excerpt = '\n'.join(f'{j+1}: {src[j][:450]}' for j in range(a,b))
                  block(f'Routing match at line {i+1}', p, excerpt)
                  total += 1
                  if total >= 32: break
              if total >= 32: break
          out.write_text('\n'.join(lines), encoding='utf-8')
          print(f'Wrote {out} ({out.stat().st_size:,} bytes); {len(all_files)} extracted files')
          PY

      - name: Commit native link evidence to source-review
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NATIVE_LINK_EVIDENCE.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Extract original native screen-link evidence"
          git push origin HEAD:source-review
