name: Validate AlSaqar ERP UI Assets
on:
  push:
    branches: [main]
    paths:
      - 'web-client/**'
      - '.github/workflows/web-client-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'web-client/**'
      - '.github/workflows/web-client-build.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-client
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run lint
      - name: Build UI assets
        run: npm run build
