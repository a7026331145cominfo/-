name: Focused historical source review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract nested historical archives
        shell: bash
        run: |
          set -euo pipefail
          COMMIT="3a9492c85ca92a03d9a2b696ec8d351f380526bd"
          TMP="$RUNNER_TEMP/historical_project"
          mkdir -p "$TMP/unpacked"
          git show "$COMMIT:iLoveZIP_Create(1).zip" > "$TMP/outer.zip"
          unzip -q -o "$TMP/outer.zip" -d "$TMP/unpacked"
          for level in 1 2 3 4 5; do
            found=0
            while IFS= read -r -d '' z; do
              found=1; d="$(dirname "$z")/__unzipped__"
              mkdir -p "$d"; unzip -q -o "$z" -d "$d"; rm -f "$z"
            done < <(find "$TMP/unpacked" -type f -iname '*.zip' -print0)
            [ "$found" -eq 0 ] && break
          done

      - name: Focused analysis
        shell: bash
        run: |
          set +e
          ROOT="$RUNNER_TEMP/historical_project/unpacked"
          pick() { find "$ROOT" -type f -name "$1" | head -n 1; }
          show() {
            f=$(pick "$1"); [ -f "$f" ] || return
            echo "=== $1 | $f | $(wc -c < "$f") bytes ==="
            head -n "$2" "$f"
            echo
          }
          show 'MajedSoft_Build_Report.txt' 350
          show 'Project_Comparison.txt' 300
          show 'Internal_Project_Structure_Report.txt' 300
          show 'MajedSoft-TRUE-Screen-Mapping.txt' 300
          show '05_CORE_SOURCE_REPORT.txt' 300
          show '06_SALES_PURCHASE_CORE.txt' 300
          show '07_ITEMS_ORDERS_REAL.txt' 300
          show '08_TVP_ITEMS_DEFINITION.txt' 300
          show 'GTS_Orders_BLL.txt' 500
          show 'GTSErp_SOURCE_MAP.txt' 500
          echo '=== PROJECT-SOURCE TODO / PLACEHOLDER / NOT IMPLEMENTED ==='
          f=$(pick 'AlSaqar_Internal_Source_Map.txt')
          if [ -f "$f" ]; then
            grep -nE 'GTSErpSystem_Source|TODO / PLACEHOLDER / NOT IMPLEMENTED|TODO:|FIXME|NOT IMPLEMENTED|PLACEHOLDER' "$f" 2>/dev/null | grep -E 'GTSErpSystem_Source|TODO / PLACEHOLDER / NOT IMPLEMENTED|TODO:|FIXME|NOT IMPLEMENTED|PLACEHOLDER' | head -n 1200
            echo '=== GAP SECTION AROUND 376609 ==='
            sed -n '376580,376660p' "$f"
          fi
          echo '=== ORIGINAL SCREEN COUNTS / SUMMARY ==='
          for n in 01_Screens.csv 06_Screen_Summary.csv; do
            f=$(pick "$n"); [ -f "$f" ] && { echo "=== $n ==="; head -n 120 "$f"; echo; };
          done