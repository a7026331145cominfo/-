name: Focused build report review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract nested historical archives
        shell: bash
        run: |
          set -euo pipefail
          COMMIT="3a9492c85ca92a03d9a2b696ec8d351f380526bd"
          TMP="$RUNNER_TEMP/historical_project"
          mkdir -p "$TMP/unpacked"
          git show "$COMMIT:iLoveZIP_Create(1).zip" > "$TMP/outer.zip"
          unzip -q -o "$TMP/outer.zip" -d "$TMP/unpacked"
          for level in 1 2 3 4 5; do
            found=0
            while IFS= read -r -d '' z; do
              found=1; d="$(dirname "$z")/__unzipped__"
              mkdir -p "$d"; unzip -q -o "$z" -d "$d"; rm -f "$z"
            done < <(find "$TMP/unpacked" -type f -iname '*.zip' -print0)
            [ "$found" -eq 0 ] && break
          done
      - name: Read build and comparison reports
        shell: bash
        run: |
          set +e
          ROOT="$RUNNER_TEMP/historical_project/unpacked"
          show_utf16() {
            f=$(find "$ROOT" -type f -name "$1" | head -n 1)
            [ -f "$f" ] || return
            echo "=== $1 ($f; $(wc -c < "$f") bytes) ==="
            iconv -f UTF-16LE -t UTF-8 "$f" 2>/dev/null | head -n "$2"
            echo
          }
          show_utf8() {
            f=$(find "$ROOT" -type f -name "$1" | head -n 1)
            [ -f "$f" ] || return
            echo "=== $1 ($f; $(wc -c < "$f") bytes) ==="
            head -n "$2" "$f"
            echo
          }
          show_utf16 'MajedSoft_Build_Report.txt' 500
          show_utf16 'Project_Comparison.txt' 500
          show_utf16 'Internal_Project_Structure_Report.txt' 450
          echo '=== BUILD ERROR/SUCCESS LINES ==='
          f=$(find "$ROOT" -type f -name 'MajedSoft_Build_Report.txt' | head -n 1)
          if [ -f "$f" ]; then
            iconv -f UTF-16LE -t UTF-8 "$f" 2>/dev/null | grep -nEi 'error|failed|failure|success|warning|build|restore|compile|missing|not found' | head -n 1200
          fi